const FIXED_AMOUNT=5000;
const pinInput=document.getElementById("pin");
const error=document.getElementById("error");
const currentBalance=document.getElementById("currentBalance");
function formatMoney(value){return "₦"+Number(value).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function updateCurrentBalance(){let balance=Number(localStorage.getItem("dashboardBalance"));if(!Number.isFinite(balance)){balance=82753;localStorage.setItem("dashboardBalance",String(balance))}currentBalance.textContent=formatMoney(balance)}
function addFunds(){error.textContent="";const pin=pinInput.value.trim();let usedPins=[];try{usedPins=JSON.parse(localStorage.getItem("usedAddFundsPins_v2")||"[]");if(!Array.isArray(usedPins))usedPins=[]}catch(e){usedPins=[]}if(!/^\d{6}$/.test(pin)||!VALID_CODES.includes(pin)||usedPins.includes(pin)){error.textContent="Incorrect PIN";pinInput.value="";pinInput.focus();return}usedPins.push(pin);localStorage.setItem("usedAddFundsPins_v2",JSON.stringify(usedPins));let balance=Number(localStorage.getItem("dashboardBalance"));if(!Number.isFinite(balance))balance=82753;balance+=FIXED_AMOUNT;localStorage.setItem("dashboardBalance",String(balance));const now=new Date();let history=[];try{history=JSON.parse(localStorage.getItem("transactionHistory")||"[]");if(!Array.isArray(history))history=[]}catch(e){history=[]}history.unshift({type:"in",title:"Funds Added",amount:FIXED_AMOUNT,date:now.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}),time:now.toLocaleTimeString("en-NG",{hour:"2-digit",minute:"2-digit"}),timestamp:Date.now()});history.sort((a,b)=>Number(b.timestamp||0)-Number(a.timestamp||0)).splice(5);localStorage.setItem("transactionHistory",JSON.stringify(history));window.location.href="dashboard.html"}
function goBack(){window.location.href="dashboard.html"}
pinInput.addEventListener("input",()=>{pinInput.value=pinInput.value.replace(/\D/g,"").slice(0,6);error.textContent=""});pinInput.addEventListener("keydown",event=>{if(event.key==="Enter")addFunds()});updateCurrentBalance();
