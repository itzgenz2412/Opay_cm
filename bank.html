<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer to Bank Account</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#0f0f0f;color:white;margin:0;padding:0}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#1a1a1a}
.header b{font-size:16px}
.header span{color:#00d68f;font-size:14px}
.free-box{margin:12px;background:#2a2440;border-radius:10px;padding:12px 14px;color:#8a7ed6;font-size:13px}
.card{background:#1c1c1e;margin:12px;border-radius:16px;padding:16px}
.card-title{font-weight:600;font-size:15px;margin-bottom:14px}
.input-line{border-bottom:1px solid #2c2c2e;padding:16px 0;display:flex;justify-content:space-between;align-items:center}
.input-line input{background:transparent;border:none;color:white;width:100%;font-size:14px;outline:none}
.input-line select{background:transparent;border:none;color:white;width:100%;font-size:14px;outline:none}
#accountNameDisplay{padding:12px 0 0 0;display:none;font-weight:bold;text-transform:uppercase;font-size:14px}
.loader{display:none;color:#777;font-size:13px;margin-top:8px}
.btn-next{width:100%;background:#12372f;color:#0a5c46;border:none;padding:16px;border-radius:30px;margin-top:20px;font-weight:bold;font-size:15px;pointer-events:none;opacity:0.6}
.btn-next.enabled{background:#00d68f;color:#000;pointer-events:auto;opacity:1}
</style>
</head>
<body>

<div class="header">
  <div onclick="window.location.href='dashboard.html'" style="cursor:pointer"><b>Transfer to Bank Account</b></div>
  <span onclick="window.location.href='history.html'" style="cursor:pointer">History</span>
</div>

<div class="free-box">Free transfers for the day: <b>3</b></div>

<div class="card">
  <div class="card-title">Recipient Account</div>
  <div class="input-line">
    <input type="text" inputmode="numeric" id="accountNumber" placeholder="Enter 10 digits Account Number" maxlength="10">
  </div>
  <div id="accountNameDisplay"></div>
  <p class="loader" id="loader">Checking name...</p>
  <div class="input-line">
    <select id="bankList"><option value="">Select Bank</option></select>
  </div>
  <button class="btn-next" id="nextBtn">Next</button>
</div>

<script>
const PAYSTACK_KEY = "sk_test_bb7b385e95d648dc88371fb955c3b8ce062b1115";
const bankListEl = document.getElementById('bankList');
const accInput = document.getElementById('accountNumber');
const accNameDiv = document.getElementById('accountNameDisplay');
const loader = document.getElementById('loader');
const nextBtn = document.getElementById('nextBtn');

const BANKS = [
 {code:"999992", name:"OPay"},
 {code:"999991", name:"PalmPay"},
 {code:"090267", name:"Kuda Bank"},
 {code:"50515", name:"Moniepoint MFB"},
 {code:"044", name:"Access Bank"},
 {code:"058", name:"GTBank"},
 {code:"011", name:"First Bank"},
 {code:"033", name:"UBA"},
 {code:"057", name:"Zenith Bank"},
 {code:"035", name:"Wema Bank"},
 {code:"070", name:"Fidelity Bank"},
 {code:"032", name:"Union Bank"},
 {code:"221", name:"Stanbic IBTC"}
];
bankListEl.innerHTML='<option value="">Select Bank</option>';
BANKS.forEach(b=>{let o=document.createElement('option');o.value=b.code;o.textContent=b.name;bankListEl.appendChild(o);});

async function checkName(){
  const acc=accInput.value.trim();
  const bankCode=bankListEl.value;
  if(acc.length!==10 || !bankCode) return;
  loader.style.display="block";
  accNameDiv.style.display="none";
  nextBtn.classList.remove('enabled');
  try{
    const apiUrl = `https://api.paystack.co/bank/resolve?account_number=${acc}&bank_code=${bankCode}`;
    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,{
      headers:{"Authorization":"Bearer "+PAYSTACK_KEY}
    });
    const data = await res.json();
    loader.style.display="none";
    if(data.status===true && data.data && data.data.account_name){
      accNameDiv.style.display="block";
      accNameDiv.style.color="#00d68f";
      accNameDiv.textContent="✓ "+data.data.account_name;
      nextBtn.classList.add('enabled');
      localStorage.setItem('transfer_name', data.data.account_name);
      localStorage.setItem('transfer_account', acc);
      localStorage.setItem('transfer_bank', bankListEl.options[bankListEl.selectedIndex].text);
      localStorage.setItem('transfer_bankCode', bankCode);
    }else{
      accNameDiv.style.display="block";
      accNameDiv.style.color="#ff4444";
      accNameDiv.textContent="✗ "+ (data.message || "Invalid account number");
      nextBtn.classList.remove('enabled');
    }
  }catch(e){
    loader.style.display="none";
    accNameDiv.style.display="block";
    accNameDiv.style.color="#ff4444";
    accNameDiv.textContent="✗ Cannot verify - check bank is correct";
  }
}

accInput.addEventListener('input',function(){
  this.value=this.value.replace(/[^0-9]/g,'').slice(0,10);
  if(this.value.length===10 && bankListEl.value) checkName();
  else { nextBtn.classList.remove('enabled'); accNameDiv.style.display="none"; }
});
bankListEl.addEventListener('change',function(){ if(accInput.value.length===10) checkName(); });
nextBtn.addEventListener('click',function(){ if(nextBtn.classList.contains('enabled')) window.location.href='print2.html'; });
accNameDiv.addEventListener('click',function(){ if(nextBtn.classList.contains('enabled')) window.location.href='print2.html'; });
</script>
</body>
</html>
