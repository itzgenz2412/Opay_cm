<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank</title>
<style>
  body {
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background:#121212;
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    text-align:center;
  }
  .header {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:60px;
    background:#1e1e1e;
    display:flex;
    align-items:center;
    padding:0 15px;
    box-sizing:border-box;
    border-bottom:1px solid #2a2a2a;
  }
  .back {
    width:38px;
    height:38px;
    background:#2a2a2a;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    cursor:pointer;
    color:#fff;
  }
  .title {
    margin-left:15px;
    font-weight:600;
    font-size:18px;
  }
  .content h2 { margin:15px 0 8px; font-size:20px; }
  .content p { color:#888; font-size:14px; }
  .icon-box {
    width:90px;
    height:90px;
    background:#1e1e1e;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    margin:0 auto;
  }
</style>
</head>
<body>

<div class="header">
  <div class="back" onclick="window.location.href='dashboard.html'">←</div>
  <div class="title">Bank</div>
</div>

<div class="content">
  <div class="icon-box">🚧</div>
  <h2>Under Construction</h2>
  <p>Bank feature is coming soon</p>
</div>

<script>
history.pushState(null, null, location.href);
window.addEventListener('popstate', function(){
  window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
