<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Transfer to Bank Account</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#121212;
  color:#fff;
}

body{
  overflow-x:hidden;
}

.page{
  width:100%;
  max-width:712px;
  margin:auto;
  min-height:100vh;
  padding-bottom:40px;
}

/* HEADER */
.header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #292929;
}

.back{
  font-size:30px;
  cursor:pointer;
  width:45px;
}

.title{
  font-size:20px;
  font-weight:600;
  flex:1;
  text-align:center;
}

.history{
  font-size:14px;
  color:#00c853;
  cursor:pointer;
}

/* FORM */
.form{
  margin:28px 4.2% 0;
  padding:25px 4%;
  background:#1b1b1b;
  border-radius:14px;
}

label{
  display:block;
  font-size:13px;
  color:#aaa;
  margin-bottom:8px;
}

input,
select{
  width:100%;
  height:52px;
  border:none;
  outline:none;
  border-radius:10px;
  background:#252525;
  color:#fff;
  padding:0 15px;
  font-size:16px;
  margin-bottom:20px;
}

input::placeholder{
  color:#777;
}

.account-name{
  width:100%;
  min-height:52px;
  border-radius:10px;
  background:#252525;
  display:flex;
  align-items:center;
  padding:0 15px;
  color:#777;
  font-size:16px;
  margin-bottom:20px;
}

/* LOADER */
.loader{
  display:none;
  color:#00c853;
  font-size:13px;
  margin-top:-12px;
  margin-bottom:15px;
}

/* ERROR */
.error-box{
  display:none;
  background:#351818;
  border:1px solid #8d2c2c;
  border-radius:10px;
  padding:12px;
  margin-top:-5px;
  margin-bottom:18px;
  color:#ff8a8a;
  font-size:13px;
  line-height:1.5;
  word-break:break-word;
}

.error-title{
  font-weight:600;
  color:#ff5252;
  margin-bottom:5px;
}

/* BUTTON */
.next{
  width:100%;
  height:52px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.next:disabled{
  background:#333;
  color:#777;
  cursor:not-allowed;
}

/* MONITOR */
.section{
  margin:25px 4.2% 0;
}

.section-title{
  font-size:16px;
  font-weight:600;
  margin-bottom:12px;
}

.monitor{
  background:#1b1b1b;
  border-radius:14px;
  padding:18px;
  color:#888;
  font-size:14px;
}

/* FAVOURITES */
.favourites{
  margin-top:25px;
  background:#1b1b1b;
  border-radius:14px;
  padding:18px;
  color:#888;
  font-size:14px;
}
</style>
</head>

<body>

<div class="page">

  <div class="header">
    <div class="back" onclick="goBack()">‹</div>

    <div class="title">Transfer to Bank Account</div>

    <div class="history" onclick="goHistory()">History</div>
  </div>

  <div class="form">

    <label>Bank</label>

    <select id="bankSelect">
      <option value="">Select Bank</option>

      <option value="999992">OPay</option>
      <option value="100033">PalmPay</option>
      <option value="50211">Kuda</option>
      <option value="50515">Moniepoint</option>

      <option value="044">Access Bank</option>
      <option value="058">GTBank</option>
      <option value="011">First Bank</option>
      <option value="033">UBA</option>
      <option value="057">Zenith Bank</option>
      <option value="035">Wema Bank</option>
      <option value="070">Fidelity Bank</option>
      <option value="032">Union Bank</option>
      <option value="221">Stanbic IBTC</option>
      <option value="068">Standard Chartered</option>
    </select>


    <label>Account Number</label>

    <input
      id="accountNumber"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="Enter account number"
    >


    <label>Account Name</label>

    <div id="accountNameDisplay" class="account-name">
      Account Name
    </div>

    <div id="loader" class="loader">
      Checking...
    </div>

    <div id="errorBox" class="error-box">
      <div class="error-title">Verification failed</div>
      <div id="errorText"></div>
    </div>


    <label>Amount</label>

    <input
      id="amount"
      type="number"
      inputmode="decimal"
      placeholder="Enter amount"
    >


    <button id="nextButton" class="next" disabled onclick="nextPage()">
      Next
    </button>

  </div>


  <div class="section">

    <div class="section-title">
      Monitor
    </div>

    <div class="monitor">
      No recent transfers
    </div>

  </div>


  <div class="section">

    <div class="section-title">
      Favourites
    </div>

    <div class="favourites">
      No favourite accounts
    </div>

  </div>

</div>


<script>

/* ==============================
   PAYSTACK KEY
============================== */

const PAYSTACK_KEY =
"sk_test_bb7b385e95d648dc88371fb955c3b8ce062b1115";


/* ==============================
   ELEMENTS
============================== */

const accountInput =
document.getElementById("accountNumber");

const bankSelect =
document.getElementById("bankSelect");

const accNameDiv =
document.getElementById("accountNameDisplay");

const loader =
document.getElementById("loader");

const errorBox =
document.getElementById("errorBox");

const errorText =
document.getElementById("errorText");

const nextBtn =
document.getElementById("nextButton");


/* ==============================
   PLACEHOLDER
============================== */

function showPlaceholder(){

  accNameDiv.style.display = "flex";
  accNameDiv.style.color = "#777";
  accNameDiv.textContent = "Account Name";

  nextBtn.disabled = true;
}


/* ==============================
   SHOW ERROR
============================== */

function showError(message){

  errorBox.style.display = "block";
  errorText.textContent = message;

  accNameDiv.style.color = "#777";
  accNameDiv.textContent = "Account Name";

  nextBtn.disabled = true;
}


/* ==============================
   HIDE ERROR
============================== */

function hideError(){

  errorBox.style.display = "none";
  errorText.textContent = "";

}


/* ==============================
   VERIFY ACCOUNT
============================== */

async function checkName(){

  const accountNumber =
    accountInput.value.trim();

  const bankCode =
    bankSelect.value;


  if(accountNumber.length !== 10){
    showPlaceholder();
    hideError();
    return;
  }


  if(!bankCode){
    showPlaceholder();
    hideError();
    return;
  }


  hideError();

  loader.style.display = "block";

  nextBtn.disabled = true;


  /*
    Paystack account resolve endpoint
  */

  const paystackUrl =
    "https://api.paystack.co/bank/resolve" +
    "?account_number=" +
    encodeURIComponent(accountNumber) +
    "&bank_code=" +
    encodeURIComponent(bankCode);


  /*
    Proxy URL
  */

  const proxyUrl =
    "https://thingproxy.freeboard.io/fetch/" +
    paystackUrl;


  try{

    console.log("Verification started");

    console.log("Account:", accountNumber);

    console.log("Bank code:", bankCode);

    console.log("Request URL:", proxyUrl);


    const response = await fetch(proxyUrl,{

      method:"GET",

      headers:{
        "Authorization":
          "Bearer " + PAYSTACK_KEY,

        "Content-Type":
          "application/json"
      }

    });


    /*
      SHOW HTTP STATUS
    */

    console.log(
      "HTTP status:",
      response.status
    );

    console.log(
      "HTTP status text:",
      response.statusText
    );


    /*
      Read response as text first.
      This helps us see proxy/API errors
      even when the response isn't JSON.
    */

    const responseText =
      await response.text();


    console.log(
      "Raw response:",
      responseText
    );


    /*
      HTTP ERROR
    */

    if(!response.ok){

      let message =
        "HTTP " +
        response.status +
        " " +
        response.statusText;


      if(responseText){

        message +=
          " — " +
          responseText.substring(0,500);

      }


      throw new Error(message);

    }


    /*
      Try to parse JSON
    */

    let result;

    try{

      result =
        JSON.parse(responseText);

    }catch(jsonError){

      throw new Error(
        "The server returned a response that is not valid JSON: " +
        responseText.substring(0,500)
      );

    }


    console.log(
      "Parsed Paystack response:",
      result
    );


    /*
      PAYSTACK SUCCESS
    */

    if(
      result &&
      result.status === true &&
      result.data &&
      result.data.account_name
    ){

      const accountName =
        result.data.account_name;


      accNameDiv.style.display =
        "flex";

      accNameDiv.style.color =
        "#fff";

      accNameDiv.textContent =
        accountName;


      nextBtn.disabled = false;


      /*
        SAVE DETAILS
      */

      localStorage.setItem(
        "transfer_name",
        accountName
      );

      localStorage.setItem(
        "transfer_account",
        accountNumber
      );

      localStorage.setItem(
        "transfer_bank",
        bankSelect.options[
          bankSelect.selectedIndex
        ].text
      );

      localStorage.setItem(
        "transfer_bankCode",
        bankCode
      );


      console.log(
        "Account verified successfully:",
        accountName
      );

    }

    else{

      /*
        PAYSTACK RETURNED AN API ERROR
      */

      let message =
        "Paystack did not verify this account.";

      if(result){

        if(result.message){

          message +=
            " Message: " +
            result.message;

        }

        if(
          result.data &&
          typeof result.data === "string"
        ){

          message +=
            " Data: " +
            result.data;

        }

      }


      throw new Error(message);

    }

  }

  catch(error){

    console.error(
      "Verification error:",
      error
    );


    showError(
      error.message ||
      "Unknown verification error"
    );

  }

  finally{

    loader.style.display =
      "none";

  }

}


/* ==============================
   ACCOUNT INPUT
============================== */

accountInput.addEventListener(
  "input",
  function(){

    this.value =
      this.value
      .replace(/\D/g,"")
      .slice(0,10);


    hideError();


    if(
      this.value.length === 10 &&
      bankSelect.value
    ){

      checkName();

    }else{

      showPlaceholder();

    }

  }
);


/* ==============================
   BANK CHANGE
============================== */

bankSelect.addEventListener(
  "change",
  function(){

    hideError();


    if(
      accountInput.value.length === 10 &&
      this.value
    ){

      checkName();

    }else{

      showPlaceholder();

    }

  }
);


/* ==============================
   NEXT
============================== */

function nextPage(){

  if(nextBtn.disabled){
    return;
  }


  localStorage.setItem(
    "transfer_amount",
    document.getElementById("amount").value
  );


  window.location.href =
    "print2.html";

}


/* ==============================
   BACK
============================== */

function goBack(){

  window.location.href =
    "dashboard.html";

}


/* ==============================
   HISTORY
============================== */

function goHistory(){

  window.location.href =
    "history.html";

}

</script>

</body>
</html>
