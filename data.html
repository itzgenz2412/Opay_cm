<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Mobile Data</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#171719;
  font-family:Arial,Roboto,sans-serif;
}

.page{
  position:relative;
  width:100%;
  max-width:691px;
  margin:auto;
  overflow:hidden;
}

.page > img{
  display:block;
  width:100%;
  height:auto;
}


/* =====================================
   BACK BUTTON
   ===================================== */

.back{
  position:absolute;
  left:5%;
  top:4.0%;

  width:8%;
  height:5%;

  background:transparent;
  border:0;
  padding:0;

  z-index:20;
}


/* =====================================
   HISTORY BUTTON
   ===================================== */

.history{
  position:absolute;
  right:2%;
  top:4.0%;

  width:19%;
  height:5%;

  background:transparent;
  border:0;
  padding:0;

  z-index:20;
}


/* =====================================
   PHONE NUMBER INPUT
   ===================================== */

.numberBox{
  position:absolute;

  left:17.5%;
  top:22.5%;

  width:66%;
  height:3%;

  border:none;
  outline:none;

  background:#2c2c2c;

  color:#eeeeee;

  font-family:Arial,Roboto,sans-serif;
  font-size:clamp(18px,4.7vw,32px);
  font-weight:400;

  letter-spacing:1px;

  padding:0 4px;

  border-radius:3px;

  z-index:15;
}

.numberBox:focus{
  background:#292929;
}

.numberBox::placeholder{
  color:#eeeeee;
  opacity:1;
}


/* =====================================
   NETWORK ICON
   ===================================== */

.page .networkIcon{
  position:absolute;

  left:3.5%;
  top:22.15%;

  width:6.5%;
  height:3.3%;

  object-fit:contain;

  z-index:25;

  pointer-events:none;

  display:none;
}


/* =====================================
   SEND BUTTON
   ===================================== */

.send{
  position:absolute;

  right:4%;
  top:22.0%;

  width:13%;
  height:4.0%;

  border:none;
  border-radius:8px;

  background:#20c997;
  color:#111;

  font-size:clamp(12px,3.2vw,20px);
  font-weight:700;

  z-index:20;

  cursor:pointer;
}

.send:disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* =====================================
   DATA PLAN CLICKABLE AREAS
   ===================================== */

.plan{
  position:absolute;

  background:transparent;
  border:0;
  padding:0;
  margin:0;

  z-index:10;

  cursor:pointer;
}


/* 1GB - 1 Day */
.plan1{
  left:6.2%;
  top:50.4%;
  width:28%;
  height:12.7%;
}


/* 2.5GB - 1 Day */
.plan2{
  left:35.8%;
  top:50.4%;
  width:28%;
  height:12.7%;
}


/* 2.5GB - 2 Days */
.plan3{
  left:65.5%;
  top:50.4%;
  width:28%;
  height:12.7%;
}


/* 500MB - 7 Days */
.plan4{
  left:6.2%;
  top:63.8%;
  width:28%;
  height:12.8%;
}


/* 1GB - 7 Days */
.plan5{
  left:35.8%;
  top:63.8%;
  width:28%;
  height:12.8%;
}


/* 3.5GB - 7 Days */
.plan6{
  left:65.5%;
  top:63.8%;
  width:28%;
  height:12.8%;
}


/* 2GB - 30 Days */
.plan7{
  left:6.2%;
  top:77.2%;
  width:28%;
  height:12.8%;
}


/* 7GB - 30 Days */
.plan8{
  left:35.8%;
  top:77.2%;
  width:28%;
  height:12.8%;
}


/* =====================================
   BOTTOM SHEET OVERLAY
   ===================================== */

.sheetOverlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.45);

  opacity:0;
  visibility:hidden;

  transition:
    opacity .25s ease,
    visibility .25s ease;

  z-index:999;
}

.sheetOverlay.open{
  opacity:1;
  visibility:visible;
}


/* =====================================
   BOTTOM SHEET
   ===================================== */

.sheet{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:50vh;
  min-height:330px;

  background:#292929;

  border-radius:22px 22px 0 0;

  box-shadow:
    0 -8px 30px rgba(0,0,0,.55);

  transform:translateY(100%);

  transition:
    transform .30s ease;

  z-index:1000;

  overflow:hidden;
}

.sheet.open{
  transform:translateY(0);
}


/* =====================================
   DRAG HANDLE
   ===================================== */

.handle{
  width:45px;
  height:5px;

  background:#777;

  border-radius:10px;

  margin:10px auto 6px;
}


/* =====================================
   CLOSE BUTTON
   ===================================== */

.close{
  position:absolute;

  right:18px;
  top:12px;

  width:36px;
  height:36px;

  border:0;
  border-radius:50%;

  background:#3a3a3a;
  color:white;

  font-size:22px;

  z-index:10;

  cursor:pointer;
}


/* =====================================
   DATAPLANS PAGE
   ===================================== */

.sheet iframe{
  display:block;

  width:100%;
  height:calc(100% - 45px);

  border:0;

  background:#292929;
}
</style>
</head>


<body>

<div class="page">

  <!-- DATA PAGE IMAGE -->
  <img src="data.png" alt="Mobile Data">


  <!-- BACK -->
  <a
    href="dashboard.html"
    class="back"
    aria-label="Back">
  </a>


  <!-- HISTORY -->
  <a
    href="history.html"
    class="history"
    aria-label="History">
  </a>


  <!-- PHONE NUMBER -->
  <input
    id="phoneNumber"
    class="numberBox"
    type="tel"
    inputmode="numeric"
    maxlength="11"
    autocomplete="off"
    value=""
    placeholder="Enter phone number"
  >


  <!-- NETWORK ICON -->
  <img
    id="networkIcon"
    class="networkIcon"
    src=""
    alt=""
  >


  <!-- SEND -->
  <button
    class="send"
    id="sendButton"
    onclick="sendNumber()"
    disabled>
    Send
  </button>


  <!-- DATA PLANS -->

  <button
    class="plan plan1"
    onclick="openPlans('plan1')"
    aria-label="1GB 1 Day">
  </button>

  <button
    class="plan plan2"
    onclick="openPlans('plan2')"
    aria-label="2.5GB 1 Day">
  </button>

  <button
    class="plan plan3"
    onclick="openPlans('plan3')"
    aria-label="2.5GB 2 Days">
  </button>

  <button
    class="plan plan4"
    onclick="openPlans('plan4')"
    aria-label="500MB 7 Days">
  </button>

  <button
    class="plan plan5"
    onclick="openPlans('plan5')"
    aria-label="1GB 7 Days">
  </button>

  <button
    class="plan plan6"
    onclick="openPlans('plan6')"
    aria-label="3.5GB 7 Days">
  </button>

  <button
    class="plan plan7"
    onclick="openPlans('plan7')"
    aria-label="2GB 30 Days">
  </button>

  <button
    class="plan plan8"
    onclick="openPlans('plan8')"
    aria-label="7GB 30 Days">
  </button>

</div>


<!-- DARK OVERLAY -->

<div
  id="sheetOverlay"
  class="sheetOverlay"
  onclick="closePlans()">
</div>


<!-- BOTTOM DATAPLANS PANEL -->

<div
  id="sheet"
  class="sheet">

  <div class="handle"></div>

  <button
    class="close"
    onclick="closePlans()"
    aria-label="Close">
    ×
  </button>

  <iframe
    id="plansFrame"
    src="about:blank"
    title="Data Plans">
  </iframe>

</div>


<script>

/* =====================================
   ELEMENTS
   ===================================== */

const phoneNumber =
  document.getElementById("phoneNumber");

const sendButton =
  document.getElementById("sendButton");

const networkIcon =
  document.getElementById("networkIcon");

const sheet =
  document.getElementById("sheet");

const overlay =
  document.getElementById("sheetOverlay");

const frame =
  document.getElementById("plansFrame");


/* =====================================
   NIGERIAN NETWORK PREFIXES
   ===================================== */

const networkPrefixes = {

  MTN: [
    "0703",
    "0706",
    "0803",
    "0806",
    "0810",
    "0813",
    "0814",
    "0816",
    "0903",
    "0906",
    "0913",
    "0916"
  ],

  Airtel: [
    "0701",
    "0708",
    "0802",
    "0808",
    "0812",
    "0901",
    "0902",
    "0904",
    "0907",
    "0911",
    "0912"
  ],

  Glo: [
    "0705",
    "0805",
    "0807",
    "0811",
    "0815",
    "0905",
    "0915"
  ],

  "9mobile": [
    "0809",
    "0817",
    "0818",
    "0908",
    "0909"
  ]

};


/* =====================================
   NETWORK ICON FILES
   ===================================== */

const networkIcons = {

  MTN: "mtn.png",

  Airtel: "airtel.png",

  Glo: "glo.png",

  "9mobile": "9mobile.png"

};


/* =====================================
   DETECT NETWORK
   ===================================== */

function detectNetwork(number){

  const prefix =
    number.substring(0,4);

  for(const network in networkPrefixes){

    if(
      networkPrefixes[network]
        .includes(prefix)
    ){

      return network;

    }

  }

  return "";
}


/* =====================================
   UPDATE NETWORK ICON
   ===================================== */

function updateNetworkIcon(){

  const number =
    phoneNumber.value
      .replace(/\D/g,"");

  const network =
    detectNetwork(number);

  if(
    network &&
    networkIcons[network]
  ){

    networkIcon.src =
      networkIcons[network];

    networkIcon.style.display =
      "block";

  }else{

    networkIcon.src =
      "";

    networkIcon.style.display =
      "none";

  }

}


/* =====================================
   CHECK NUMBER
   ===================================== */

function updateSendButton(){

  const number =
    phoneNumber.value
      .replace(/\D/g,"");

  const network =
    detectNetwork(number);

  /*
   SEND IS ENABLED ONLY WHEN:
   - NUMBER HAS 11 DIGITS
   - NUMBER BELONGS TO A RECOGNIZED NETWORK
  */

  const validNumber =
    number.length === 11 &&
    network !== "";

  sendButton.disabled =
    !validNumber;

}


/* =====================================
   PHONE INPUT
   ===================================== */

phoneNumber.addEventListener(
  "input",
  function(){

    this.value =
      this.value
        .replace(/\D/g,"")
        .slice(0,11);

    updateSendButton();

    updateNetworkIcon();

  }
);


/* =====================================
   OPEN DATAPLANS
   ===================================== */

function openPlans(planID){

  const number =
    phoneNumber.value
      .replace(/\D/g,"");

  const network =
    detectNetwork(number);

  /*
   DO NOT OPEN DATAPLANS
   IF NETWORK IS UNKNOWN
  */

  if(
    number.length !== 11 ||
    network === ""
  ){

    return;

  }


  localStorage.setItem(
    "dataPhoneNumber",
    number
  );

  localStorage.setItem(
    "selectedDataPlan",
    planID
  );

  frame.src =
    "dataplans.html";

  sheet.classList.add("open");
  overlay.classList.add("open");

}


/* =====================================
   SEND BUTTON
   ===================================== */

function sendNumber(){

  const number =
    phoneNumber.value
      .replace(/\D/g,"");

  const network =
    detectNetwork(number);

  /*
   EXTRA SAFETY CHECK
  */

  if(
    number.length !== 11 ||
    network === ""
  ){

    sendButton.disabled = true;

    return;

  }


  localStorage.setItem(
    "dataPhoneNumber",
    number
  );

  localStorage.setItem(
    "selectedDataPlan",
    "plan1"
  );

  frame.src =
    "dataplans.html";

  sheet.classList.add("open");
  overlay.classList.add("open");

}


/* =====================================
   CLOSE DATAPLANS
   ===================================== */

function closePlans(){

  sheet.classList.remove("open");
  overlay.classList.remove("open");

}


/* =====================================
   LOAD SAVED NUMBER
   ===================================== */

const savedNumber =
  localStorage.getItem("dataPhoneNumber");

if(savedNumber){

  phoneNumber.value =
    savedNumber
      .replace(/\D/g,"")
      .slice(0,11);

}


/* =====================================
   INITIAL STATE
   ===================================== */

updateSendButton();
updateNetworkIcon();

</script>

</body>
</html>
