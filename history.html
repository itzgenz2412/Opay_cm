<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>History</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#000;color:#fff;overflow-x:hidden}
.page{width:100%;min-height:100vh;background:#000;padding-bottom:30px}
.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#000;border-bottom:1px solid #151515}
.header-left{display:flex;align-items:center;gap:12px}
.back{color:#fff;text-decoration:none;font-size:26px;line-height:1}
.header-title{color:#fff;font-size:16px;font-weight:700}
.download{color:#00d68f;font-size:13px;font-weight:700;text-decoration:none}
.filters{display:flex;gap:10px;padding:12px;background:#000}
.filter{flex:1;height:44px;background:#1a1a1a;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;font-size:13px;font-weight:600;border:1px solid #222}
.arrow{color:#888;font-size:14px}
.month-card{margin:4px 12px 12px;background:#151515;border-radius:12px;overflow:hidden;border:1px solid #1e1e1e}
.month-header{padding:16px 14px 0}
.month-top{display:flex;align-items:center;justify-content:space-between}
.month-name{color:#fff;font-size:16px;font-weight:700;white-space:nowrap}
.month-arrow{color:#888;font-size:12px;margin-left:4px}
.analysis{background:#00d68f;color:#000;border-radius:20px;padding:8px 14px;font-size:11px;font-weight:800;white-space:nowrap}
.month-totals{display:flex;align-items:center;gap:18px;margin-top:10px;padding-bottom:14px}
.month-total{color:#8c8c8c;font-size:11px;font-weight:600;white-space:nowrap}
.month-total span{color:#00d68f;font-weight:700}
.month-total.out span{color:#ddd}
.month-divider{height:1px;background:#2a2a2a;margin:0 14px}
.history-item{width:100%;min-height:76px;display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #252525;cursor:pointer}
.history-item:last-child{border-bottom:none}
.icon-wrap{width:44px;height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;background:transparent;flex-shrink:0}
.data-icon{width:44px;height:44px;object-fit:contain;display:block}
.info{min-width:0;flex:1;margin-left:10px;padding-right:8px}
.name{color:#fff;font-size:13px;font-weight:600;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-info{margin-top:2px;color:#999;font-size:11px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{margin-top:1px;color:#777;font-size:10px;line-height:14px;white-space:nowrap}
.right{flex:0 0 82px;width:82px;margin-left:auto;text-align:right;align-self:center}
.amount{font-size:13px;font-weight:700;white-space:nowrap}
.amount.out-money{color:#ddd}
.amount.in-money{color:#00d68f}
.status{margin-top:4px;color:#00d68f;font-size:9px;font-weight:500;white-space:nowrap}
.empty{margin:12px;background:#151515;border-radius:12px;min-height:180px;display:flex;align-items:center;justify-content:center;color:#777;font-size:13px}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left"><a href="dashboard.html" class="back">‹</a><div class="header-title">Transactions</div></div>
    <a href="#" class="download" onclick="downloadHistory(event)">Download</a>
  </div>
  <div class="filters"><div class="filter"><span>All Categories</span><span class="arrow">▾</span></div><div class="filter"><span>All Status</span><span class="arrow">▾</span></div></div>
  <div id="historyContainer"></div>
</div>
<script>
function numberValue(v){ if(typeof v==="number") return v; return Number(String(v||"").replace(/₦/g,"").replace(/\+/g,"").replace(/,/g,"").trim())||0; }
function money(v){ return numberValue(v).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2}); }

// LOAD
let history=[];
try{ history=JSON.parse(localStorage.getItem("transactionHistory")||"[]"); if(!Array.isArray(history)) history=[]; }catch(e){ history=[]; }

// SORT NEWEST FIRST
history.sort((a,b)=> Number(b.timestamp||0) - Number(a.timestamp||0));

// === MAX 10 LOGIC - IF MORE THAN 10, DELETE OLDEST ===
if(history.length > 10){
  history = history.slice(0,10); // keep only 10 newest
  localStorage.setItem("transactionHistory", JSON.stringify(history)); // save back
}

// DISPLAY ONLY 10
const recentHistory = history.slice(0,10);
const container=document.getElementById("historyContainer");

if(recentHistory.length===0){
  container.innerHTML='<div class="empty">No transactions yet</div>';
}

function getTransactionDate(item){
  if(item.timestamp){ const d=new Date(Number(item.timestamp)); if(!isNaN(d.getTime())) return d; }
  if(item.date){ const d=new Date(item.date); if(!isNaN(d.getTime())) return d; }
  return new Date();
}
function monthKey(date){ return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0"); }
function monthName(date){ return date.toLocaleDateString("en-US",{month:"short",year:"numeric"}); }

const groups=[];
recentHistory.forEach(item=>{
  const date=getTransactionDate(item);
  const key=monthKey(date);
  let group=groups.find(g=>g.key===key);
  if(!group){ group={key:key,date:date,items:[],inTotal:0,outTotal:0}; groups.push(group); }
  group.items.push(item);
  const amount=numberValue(item.amount);
  if(item.type==="in") group.inTotal+=amount; else group.outTotal+=amount;
});

groups.forEach(group=>{
  const monthCard=document.createElement("div"); monthCard.className="month-card";
  const monthHeader=document.createElement("div"); monthHeader.className="month-header";
  const monthTop=document.createElement("div"); monthTop.className="month-top";
  const monthNameBox=document.createElement("div"); monthNameBox.className="month-name";
  monthNameBox.innerHTML=monthName(group.date)+'<span class="month-arrow">▾</span>';
  const analysis=document.createElement("div"); analysis.className="analysis"; analysis.textContent="Analysis";
  monthTop.appendChild(monthNameBox); monthTop.appendChild(analysis);
  const totals=document.createElement("div"); totals.className="month-totals";
  const inTotal=document.createElement("div"); inTotal.className="month-total"; inTotal.innerHTML='In: <span>₦'+money(group.inTotal)+'</span>';
  const outTotal=document.createElement("div"); outTotal.className="month-total out"; outTotal.innerHTML='Out: <span>₦'+money(group.outTotal)+'</span>';
  totals.appendChild(inTotal); totals.appendChild(outTotal);
  monthHeader.appendChild(monthTop); monthHeader.appendChild(totals);
  monthCard.appendChild(monthHeader);
  const divider=document.createElement("div"); divider.className="month-divider"; monthCard.appendChild(divider);

  group.items.forEach(item=>{
    const isIncoming=item.type==="in";
    const isTransfer=!!(item.bank||item.account||item.isTransfer===true||item.category==="transfer");
    const row=document.createElement("div"); row.className="history-item";
    const iconWrap=document.createElement("div"); iconWrap.className="icon-wrap";
    const icon=document.createElement("img"); icon.className="data-icon";
    if(isTransfer) icon.src="transfertobank.png";
    else if(isIncoming && (item.category==="bonus"||item.type==="bonus")) icon.src="bonus.png";
    else if(isIncoming) icon.src="funds.png";
    else icon.src="data-icon.png";
    icon.onerror=function(){ if(!this.dataset.fallback){ this.dataset.fallback="1"; this.src="data-icon.png"; } };
    iconWrap.appendChild(icon);
    const info=document.createElement("div"); info.className="info";
    const name=document.createElement("div"); name.className="name";
    if(isIncoming){ if(item.category==="bonus"||item.type==="bonus") name.textContent=item.name||"Bonus from Airtime Purchase"; else name.textContent=item.name||item.description||"Funds Added"; }
    else if(isTransfer) name.textContent="Transfer to "+(item.name||"Bank Account");
    else if(item.category==="airtime"||item.isAirtime===true) name.textContent="Airtime";
    else name.textContent="Mobile Data";
    const subInfo=document.createElement("div"); subInfo.className="sub-info";
    if(isTransfer) subInfo.textContent=item.bank||item.bankName||"";
    else if(item.category==="airtime"||item.isAirtime===true) subInfo.textContent=item.phone||item.recipient||"";
    else if(item.category==="bonus"||item.type==="bonus") subInfo.textContent=item.description||"";
    else if(isIncoming) subInfo.textContent=item.account||item.description||"Wallet Funding";
    else subInfo.textContent=item.bundle||item.plan||"Mobile Data";
    if(!subInfo.textContent) subInfo.style.display="none";
    const date=document.createElement("div"); date.className="date";
    const transactionDate=getTransactionDate(item);
    let dateText=item.date?item.date:transactionDate.toLocaleDateString("en-GB");
    dateText+= " • " + (item.time?item.time:transactionDate.toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));
    date.textContent=dateText;
    info.appendChild(name); info.appendChild(subInfo); info.appendChild(date);
    const right=document.createElement("div"); right.className="right";
    const amount=document.createElement("div");
    if(isIncoming){ amount.className="amount in-money"; amount.textContent="+₦"+money(item.amount); }
    else{ amount.className="amount out-money"; amount.textContent="-₦"+money(item.amount); }
    const status=document.createElement("div"); status.className="status"; status.textContent=item.status||"Successful";
    right.appendChild(amount); right.appendChild(status);
    row.appendChild(iconWrap); row.appendChild(info); row.appendChild(right);
    if(!isIncoming){
      row.addEventListener("click",function(){
        localStorage.setItem("selectedTransaction",JSON.stringify(item));
        localStorage.setItem("currentTransaction",JSON.stringify(item));
        if(isTransfer) window.location.href="transferinfo.html"; else window.location.href="transaction.html";
      });
    }
    monthCard.appendChild(row);
  });
  container.appendChild(monthCard);
});

function downloadHistory(event){
  event.preventDefault();
  if(history.length===0){ alert("No transaction history to download."); return; }
  let text="TRANSACTION HISTORY\n\n";
  history.forEach((item,index)=>{
    const isIncoming=item.type==="in";
    const isTransfer=!!(item.bank||item.account||item.isTransfer===true||item.category==="transfer");
    let name; if(isIncoming) name=item.name||item.description||"Funds Added"; else if(isTransfer) name="Transfer to "+(item.name||"Bank Account"); else name="Mobile Data";
    const amount=(isIncoming?"+":"-")+"₦"+money(item.amount);
    text+=(index+1)+". "+name+"\nAmount: "+amount+"\nDate: "+(item.date||"")+(item.time?" "+item.time:"")+"\nStatus: "+(item.status||"Successful")+"\n\n";
  });
  const blob=new Blob([text],{type:"text/plain"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="transaction-history.txt";
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// === USE THIS FUNCTION TO SAVE NEW TRANSACTION ANYWHERE ===
function saveTransaction(newItem){
  let h=JSON.parse(localStorage.getItem("transactionHistory")||"[]");
  if(!Array.isArray(h)) h=[];
  if(!newItem.timestamp) newItem.timestamp=Date.now();
  h.unshift(newItem); // newest on top
  if(h.length>10) h=h.slice(0,10); // max 10, delete oldest
  localStorage.setItem("transactionHistory", JSON.stringify(h));
}
</script>
</body>
</html>
