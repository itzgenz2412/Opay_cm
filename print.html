}

html,

  margin:0;

  width:100%;
  min-height:100%;
  background:#171719;
  font-family:Arial,Roboto,sans-serif;

body{

.page{

.page > img{

.text{

<body>

<div class="page">


  <!-- =================================================
       ORIGINAL PRINT IMAGE
       ================================================= -->

  <img
    src="print.jpg"
    alt="Successful Transaction">


  <!-- =================================================
       SHARP TEXT OVERLAY
       ================================================= -->


  <!-- DONE -->

  <div class="text done-text">
    Done
  </div>


  <!-- SUCCESSFUL -->

  <div class="text successful">
    Successful
  </div>


  <!-- TRANSACTION AMOUNT -->

  <div
    class="text amount"
    id="amount">
  </div>


  <!-- OPAY BONUS -->

  <div class="text bonus-label">
    OPay Bonus
  </div>


  <!-- CASHBACK -->

  <div
    class="text cashback"
    id="cashback">
  </div>


  <!-- SHARE RECEIPT -->

  <div class="text share-receipt">
    Share Receipt
  </div>


  <!-- ADD MONEY -->

  <div class="text add-money">
    Add Money
  </div>


  <!-- VIEW DETAILS -->

  <div class="text view-details">
    View Details
  </div>


  <!-- SPECIAL BONUS -->

  <div class="text special-title">
    Special Bonus For You
  </div>


  <!-- OFFER 1 -->

  <div class="text offer1-title">
    Data offers at lowes
  </div>

    Recharge Data &amp; Earn Now!
  </div>

  <div class="text go1">
    GO
  </div>


  <!-- OFFER 2 -->

  <div class="text offer2-title">
    Don't Miss Out
  </div>

  <div class="text offer2-subtitle">
    Balance with Daily Interest
  </div>

  <div class="text go2">
    GO
  </div>


  <!-- OFFER 3 -->

  <div class="text offer3-title">
    Electricity Payment
  </div>

  <div class="text offer3-subtitle">
    Fast&amp;Easy Electricity Bill Pay
  </div>

  <div class="text go3">
    GO
  </div>


  <!-- OFFER 4 -->

  <div class="text offer4-title">
    TV Payment
  </div>

  <div class="text offer4-subtitle">
    Reconnect cable TV instantly!
  </div>

  <div class="text go4">
    GO
  </div>


  <!-- =================================================
       DONE BUTTON
       ================================================= -->

  <button
    class="done"
    id="doneButton"
    aria-label="Done">
  </button>

</div>


<script>

/* =====================================
   GET TRANSACTION DATA
   ===================================== */

const amount =
  localStorage.getItem(
    "transactionAmount"
  ) || "";


const cashback =
  localStorage.getItem(
    "transactionCashback"
  ) || "";


/* =====================================
   DISPLAY AMOUNT
   ===================================== */

document.getElementById("amount")
  .textContent =
  amount;


/* =====================================
   DISPLAY CASHBACK
   ===================================== */

document.getElementById("cashback")
  .textContent =
  cashback;


/* =====================================
   DONE → DASHBOARD
   ===================================== */

document.getElementById("doneButton")
  .addEventListener(
    "click",
    function(){

      window.location.href =
        "dashboard.html";

    }
  );

</script>
