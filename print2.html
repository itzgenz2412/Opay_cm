<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>print2</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html,body{margin:0;padding:0;background:#1c1c1e;color:white}
.sheet{padding:18px 14px 30px 14px;background:#1c1c1e}
.amt{text-align:center;font-size:32px;font-weight:800;margin:8px 0 18px 0}
.info-box{background:#2a2a2a;border-radius:12px;padding:6px 14px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333;font-size:13px}
.row:last-child{border:none}
.row span:first-child{color:#999}
.row span:last-child{font-weight:600;text-align:right;max-width:65%}
.pay-title{display:flex;justify-content:space-between;margin:18px 4px 10px 4px;font-size:13px;color:#fff}
.pay-title span:last-child{color:#999;font-size:12px}
.balance-box{background:#2a2a2a;border-radius:12px;padding:14px}
.bal-head{display:flex;align-items:center;gap:10px}
.radio{width:18px;height:18px;border:2px solid #00d68f;border-radius:50%;display:flex;align-items:center;justify-content:center}
.radio i{width:8px;height:8px;background:#00d68f;border-radius:50%;display:block}
.insuf{color:#ff4d4d;font-size:12px;margin:6px 0 0 28px;display:none}
.btn-pay{width:100%;background:#2a2a2a;color:#666;border:none;padding:16px;border-radius:30px;font-weight:800;margin-top:20px;font-size:15px;pointer-events:none}
.btn-pay.enabled{background:#00d68f;color:#000;pointer-events:auto}
</style>
</head>
<body>
<div class="sheet">
  <div class="amt" id="topAmt">₦1,000.00</div>
  
  <div class="info-box">
    <div class="row"><span>Bank</span><span id="rBank">OPay Digital Services Limited (OPay)</span></div>
    <div class="row"><span>Account Number</span><span id="rAcc">8109134653</span></div>
    <div class="row"><span>Name</span><span id="rName">OLUKEMI TITILAYO ONYIA</span></div>
    <div class="row"><span>Amount</span><span id="rAmt">₦1,000.00</span></div>
    <div class="row"><span>Fee</span><span>₦0.00</span></div>
  </div>

  <div class="pay-title"><span>Payment Method</span><span>All ></span></div>
  
  <div class="balance-box">
    <div class="bal-head">
      <div class="radio"><i></i></div>
      <div style="font-size:13px;font-weight:500">Available Balance (<span id="balText">₦10,000.00</span>)</div>
    </div>
    <div class="insuf" id="insufText">Insufficient balance</div>
  </div>

  <button class="btn-pay" id="payBtn" onclick="payNow()">Pay ₦1,000.00</button>
</div>

<script>
// READ FROM bank.html + payment.html + dashboard.html
const tName = localStorage.getItem('transfer_name')||'OLUKEMI TITILAYO ONYIA';
const tBank = localStorage.getItem('transfer_bank')||'OPay Digital Services Limited (OPay)';
const tAcc = localStorage.getItem('transfer_account')||'8109134653';
const tAmt = localStorage.getItem('transfer_amount')||'1000';
const amountNum = parseFloat(tAmt)||0;
let balance = parseFloat(localStorage.getItem('dashboardBalance')||localStorage.getItem('walletBalance')||localStorage.getItem('balance')||'0')||0;

document.getElementById('topAmt').textContent = '₦'+amountNum.toLocaleString()+'.00';
document.getElementById('rBank').textContent = tBank;
document.getElementById('rAcc').textContent = tAcc;
document.getElementById('rName').textContent = tName;
document.getElementById('rAmt').textContent = '₦'+amountNum.toLocaleString()+'.00';
document.getElementById('balText').textContent = '₦'+balance.toLocaleString(undefined,{minimumFractionDigits:2});

const payBtn = document.getElementById('payBtn');
const insuf = document.getElementById('insufText');

if(amountNum > balance){
  insuf.style.display='block';
  payBtn.textContent='Pay - Insufficient balance';
  payBtn.classList.remove('enabled');
}else{
  insuf.style.display='none';
  payBtn.textContent='Pay ₦'+amountNum.toLocaleString()+'.00';
  payBtn.classList.add('enabled');
}

function payNow(){
  if(amountNum > balance){ alert('Insufficient balance'); return; }
  
  let newBal = balance - amountNum;
  localStorage.setItem('dashboardBalance', newBal);
  localStorage.setItem('walletBalance', newBal);
  localStorage.setItem('balance', newBal);
  
  // SAVE WITH CORRECT FORMAT FOR YOUR history.html
  const now = new Date();
  const tx = {
    name: tName,
    bank: tBank,
    account: tAcc,
    amount: amountNum,
    date: now.toLocaleDateString(),
    time: now.toLocaleTimeString(),
    status: 'Successful',
    id: 'OP'+Date.now(),
    timestamp: Date.now(),
    type: 'out',
    isTransfer: true,
    category: 'transfer',
    fee: '₦0.00',
    cashback: '₦2.00'
  };

  localStorage.setItem('currentTransaction', JSON.stringify(tx));
  localStorage.setItem('selectedTransaction', JSON.stringify(tx));
  
  let hist = JSON.parse(localStorage.getItem('transactionHistory')||'[]');
  hist.unshift(tx);
  localStorage.setItem('transactionHistory', JSON.stringify(hist));
  
  // Go to success page
  window.top.location.href='transaction2.html';
}
</script>
</body>
</html>
