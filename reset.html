<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Reset Demo</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#171719;
  color:white;
  font-family:Arial,Roboto,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:90%;
  max-width:500px;
  background:#222224;
  padding:25px;
  border-radius:18px;
  text-align:center;
}

h2{
  margin-top:0;
}

p{
  color:#aaa;
  line-height:1.5;
}

button{
  width:100%;
  height:55px;
  border:0;
  border-radius:12px;
  background:#6ed5a1;
  color:#101813;
  font-size:17px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="box">

  <h2>Reset Demo</h2>

  <p>
    This will erase the saved demo data and
    return the site to its first-use state.
  </p>

  <button onclick="resetSite()">
    Reset Everything
  </button>

</div>

<script>

function resetSite(){

  localStorage.clear();

  alert("Demo data has been reset.");

  window.location.href = "index.html";

}

</script>

</body>
</html>
