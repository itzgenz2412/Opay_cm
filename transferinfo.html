<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Transaction Details</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
html,body{margin:0;padding:0;background:#121212;color:white;min-height:100vh}
.page{max-width:480px;margin:0 auto;min-height:100vh;background:#121212;padding-bottom:90px}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:#1e1e1e}
.header-left{display:flex;align-items:center;gap:10px}
.header-left span{font-size:20px;cursor:pointer}
.header b{font-size:14px;font-weight:600}
.profile-icon{width:28px;height:28px;border-radius:50%;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:14px;color:#00d68f}
.card{background:#1e1e1e;border-radius:12px;margin:12px;padding:16px}
.center-card{text-align:center;padding:20px 16px 16px}
.opay-icon{width:56px;height:56px;margin:0 auto 12px auto;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #2a2a2a}
.opay-icon img{width:100%;height:100%;object-fit:cover}
.transfer-to{font-size:13px;font-weight:600;margin-bottom:8px}
.amount{font-size:26px;font-weight:800;margin-bottom:8px}
.success{color:#00d68f;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.success i{width:16px;height:16px;background:#00d68f;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;font-style:normal}
.section-title{font-size:13px;font-weight:700;margin-bottom:14px}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;font-size:12px}
.detail-row span:first-child{color:#888;font-size:11px;max-width:40%}
.detail-row span:last-child{font-weight:500;text-align:right;max-width:60%;word-break:break-word}
.divider{border:none;border-top:1px dashed #333;margin:14px 0}
.more-links{display:flex;gap:20px;margin-top:14px}
.more-links div{flex:1;display:flex;align-items:center;gap:6px;color:#00d68f;font-size:11px;font-weight:600}
.share-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;background:#00d68f;color:#000;border:none;padding:16px;border-radius:30px;font-weight:800;font-size:14px;opacity:1}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left"><span onclick="location.href='history.html'"><</span><b>Transaction Details</b></div>
    <div class="profile-icon">👤</div>
  </div>

  <div class="card center-card">
    <div class="opay-icon"><img id="bankIcon" src="opay.png" alt=""></div>
    <div class="transfer-to" id="tTo">Transfer to SUKURAT AYOKA ISMAIL</div>
    <div class="amount" id="tAmt">₦500.00</div>
    <div class="success"><i>✓</i> Successful</div>
  </div>

  <div class="card">
    <div class="section-title">Transaction Details</div>
    <div class="detail-row"><span>Recipient Details</span><span id="rDetails"></span></div>
    <div class="detail-row"><span>Transaction No.</span><span><span id="txNo"></span> ⎙</span></div>
    <div class="detail-row"><span>Payment Method</span><span>Wallet <span style="color:#888">></span></span></div>
    <div class="detail-row"><span>Transaction Date</span><span id="txDate"></span></div>
  </div>

  <div class="card">
    <div class="section-title">More Actions</div>
    <div class="detail-row"><span>Category</span><span>Transfer <span style="color:#888">></span></span></div>
    <hr class="divider">
    <div class="more-links"><div>⟳ Transfer Again</div><div>◷ View Records</div></div>
  </div>

  <button class="share-btn" onclick="return false;">Share Receipt</button>
</div>

<script>
// LOAD FROM YOUR FOLDER - 10 POPULAR BANKS
const bankIconsLocal = {
  "opay": "opay.png",
  "palmpay": "palmpay.png",
  "kuda": "kuda.png",
  "moniepoint": "moniepoint.png",
  "access": "access.png",
  "gtb": "gtbank.png",
  "gtbank": "gtbank.png",
  "first": "firstbank.png",
  "firstbank": "firstbank.png",
  "uba": "uba.png",
  "zenith": "zenith.png",
  "wema": "wema.png"
};

function getBankIcon(bankName){
  const name = String(bankName||'opay').toLowerCase();
  for(let key in bankIconsLocal){
    if(name.includes(key)) return bankIconsLocal[key];
  }
  return "opay.png";
}

const tx = JSON.parse(localStorage.getItem('selectedTransaction')|| localStorage.getItem('currentTransaction')|| '{}');
document.getElementById('bankIcon').src = getBankIcon(tx.bank);

function randomTxNo(){
  let s = '2604';
  for(let i=0;i<20;i++) s+= Math.floor(Math.random()*10);
  return s;
}
document.getElementById('txNo').textContent = randomTxNo();

function formatDate(d){
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const day = d.getDate();
  let suf='th'; if(day===1||day===21||day===31) suf='st'; else if(day===2||day===22) suf='nd'; else if(day===3||day===23) suf='rd';
  return `${months[d.getMonth()]} ${day}${suf}, ${d.getFullYear()} ${d.toLocaleTimeString()}`;
}
const dateObj = tx.timestamp? new Date(Number(tx.timestamp)) : new Date();
document.getElementById('txDate').textContent = formatDate(dateObj);

const name = (tx.name||'SUKURAT AYOKA ISMAIL').toUpperCase();
document.getElementById('tTo').textContent = 'Transfer to ' + name;
document.getElementById('tAmt').textContent = '₦'+Number(tx.amount||500).toLocaleString(undefined,{minimumFractionDigits:2});
document.getElementById('rDetails').innerHTML = `${name}<br><small style="color:#888;font-size:10px">${tx.bank||'OPay'} | ${tx.account||'816 940 3380'}</small>`;
</script>
</body>
</html>
